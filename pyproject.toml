[project]
name = "fry14-engine"
version = "0.1.0"
description = "Governed Agentic Data Product Orchestrator & Stress Scenario Agent for FR Y-14 / CCAR (synthetic demonstration platform)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "duckdb>=1.0",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "faker>=24.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.9",
]

# Phase 9+ agentic layer dependencies — NOT required for Phases 0-8 (the
# deterministic engine, Scenario Reference Store, and Stress Engine run
# without any of these, per the "agents orchestrate, code calculates"
# principle). Not yet installed/pinned/tested in this repo; captured here
# so the dependency intent is explicit ahead of Phase 9. See
# 03-implementation-plan.md §1 for rationale per package. Langfuse
# (self-hosted) and promptfoo are external tools, not Python deps — see
# the implementation plan for how they fit in.
agentic = [
    "langgraph>=0.2",          # Agent Runtime (C17): stateful supervisor/specialist graph w/ checkpointing
    "mcp>=1.0",                # MCP Tool Server (C23): FastMCP, typed tool interface
    "anthropic>=0.34",         # pinned LLM client (Claude via Anthropic API or Bedrock)
    "sqlglot>=24.0",           # AG-5 Concierge SQL guard: parse + allow-list generated SQL
    "opentelemetry-api>=1.25", # agent tracing
    "opentelemetry-sdk>=1.25",
]

# Phase 11 Agent UI (AG-UI-1..4): the web form of the dashboard this repo's
# CLI (`fry14 agent-demo`) also renders as text. Split from `agentic` above
# because it only needs Streamlit, not the LLM/graph/tracing stack those
# other phases call for — this UI drives the same real engines through
# ScriptedLlmClient, same as the CLI demo.
ui = [
    "streamlit>=1.37",
]

[project.scripts]
fry14 = "fry14_engine.cli:app"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's idiomatic default-value pattern (`= typer.Option(...)`) is a
# function call in an argument default by design; B008 is a false positive
# here specifically.
"src/fry14_engine/cli.py" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
