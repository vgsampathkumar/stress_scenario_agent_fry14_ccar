name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        # [ui] (Streamlit only) is included so tests/unit/test_ui_app.py's
        # AppTest-based tests actually run in CI, not just locally. [agentic]
        # is deliberately NOT installed here — nothing in src/ needs it yet
        # (see agent_runtime/models.py's own scope note on LlmClient).
        run: python -m pip install --upgrade pip && pip install -e ".[dev,ui]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (black)
        run: black --check src tests

      - name: Test (pytest)
        run: pytest -q --cov=fry14_engine --cov-report=term-missing
